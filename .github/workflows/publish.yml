name: Publish Homey App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:verified

  publish:
    name: Publish Homey App
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publish
        env:
          HOMEY_HEADLESS: "1"
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: npx homey app publish
      - name: Add management URL to the summary
        run: echo "Manage your app at https://tools.developer.homey.app/apps/app/com.oskarirauta.owon." >> "$GITHUB_STEP_SUMMARY"
