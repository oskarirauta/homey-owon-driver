name: Validate Homey App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate (${{ matrix.level }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        level:
          - publish
          - verified
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install musl sharp binary for Alpine Docker action
        run: npm install --no-save --include=optional --os=linux --libc=musl --cpu=x64 sharp@0.33.5
      - name: Validate at ${{ matrix.level }} level
        uses: athombv/github-action-homey-app-validate@master
        with:
          level: ${{ matrix.level }}
